name: Deploy to prod

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:

  bump-version:
    name: Bump version to ${{ github.ref_name }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version in frontend/package.json to ${{ github.ref_name }}
        run: sed -E -i 's/"version":[[:space:]]"[0-9]+.[0-9]+.[0-9]+"/"version":\ "${{ github.ref_name }}"/g' ./frontend/package.json

      - name: Commit and push updated package.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore: bump version to ${{ github.ref_name }}"
          commit_user_name: Adrien Carpentier
          commit_user_email: me@adriencarpentier.com
          commit_author: Adrien Carpentier <me@adriencarpentier.com>


  lint:
    name: Lint, format, and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Lint and format Python and sort imports
        # ruff check . : check linting, including import sorting, without fixing (to fix, use --fix)
        # ruff format --check . : check code formatting without fixing (to fix, remove --check)
        run: |
          uv run ruff --version
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check Python
        run: uv run ty check

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint and format frontend
        # biome check . : lint, import sorting, and formatting without fixing (to fix, use biome check --write .)
        working-directory: frontend
        run: |
          bunx biome --version
          bun run lint


  build-and-deploy:
    name: Deploy ${{ github.ref_type == 'tag' && github.ref_name || github.sha }} to prod
    runs-on: ubuntu-latest
    environment: production
    needs: [bump-version, lint]
    if: always() && !cancelled() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') && needs.lint.result == 'success'
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_ENVIRONMENT: "production"
    steps:

      - name: Checkout pushed commit on main
        if: github.ref_type == 'branch'
        uses: actions/checkout@v4

      - name: Checkout main after version bump
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Build for production with Bun and Vite
        shell: bash
        run: bun run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy build to server with rsync
        run: rsync -avz --exclude '.git' --chown=github:www-data --chmod=Dg=rwx,Fg=rwx ./dist/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SERVER_PATH_PROD }} # We set directory (D) and files (F) permission for group www-data to rwx so that the same users can overwrite later

      - name: Relaunch nginx on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The server allows this restart without a password. reload is not in that list, so sudo asks for a password and the job fails.
          script: sudo systemctl restart nginx.service

