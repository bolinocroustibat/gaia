[project]
name = "gaia"
version = "0.1.0"
description = "Notebooks and export tooling for Gaia data used in frontend dataviz prototypes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16",
    "ty>=0.0.62",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gaia_export*"]

[tool.ruff]
target-version = "py311"
exclude = ["notebooks"]

[tool.ty.environment]
extra-paths = ["notebooks"]

[tool.ty.src]
exclude = ["notebooks"]
